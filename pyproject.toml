[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pycmd-cli"
version = "4.0.0"
description = "Create, open, list and delete projects and their GitHub repos from one command"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nanohills" }]
keywords = ["cli", "projects", "scaffold", "github", "boilerplate"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/Yasho022/pycmd"
Issues = "https://github.com/Yasho022/pycmd/issues"

[project.scripts]
pycmd = "pycmd.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pycmd"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
